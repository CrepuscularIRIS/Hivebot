# p2sdk overlay on the dsh web profile (T-01).
# Layer order: dsh-base → dsh-web-app → $DSH_HOME profile layer → this file
# (and any later --patch overlays from P2SDK_PATCH). A patch row replaces the
# target row's whole config, so every key the row owns is restated below.

# Never print the authenticated URL (token stays out of stdout) and never open
# a browser: the token is handed off through $P2SDK_HOME/launch-token by the
# p2sdk-handoff plugin at the bottom of this file.
- id: web-runtime
  inject:
    - webStartup
  config:
    openBrowser: false
    printUrl: false
    publicUrl: !!js ctx.webStartup.publicUrl
    surfaceContext: true

# Title generation would burn one extra model call per session; in mock mode it
# would also consume a replay script entry. Fallback titles are enough.
- id: session-title-llm
  disabled: true

# Route the real provider through dsh-llm-pi-ai to the local LiteLLM endpoint.
# apiKeyEnv names the environment variable; the key value itself never enters
# config, logs, or stdout.
- id: llm-pi-ai
  config:
    providers:
      litellm:
        api: openai-completions
        baseURL: !!js process.env.P2SDK_LLM_API_BASE ?? 'http://127.0.0.1:4001/v1'
        apiKeyEnv: P2SDK_LLM_API_KEY
        models:
          - id: !!js process.env.P2SDK_LLM_MODEL ?? 'glm-5.3-flash'
            contextWindow: 131072

# Default model selection follows the provider mode.
- id: agent-default-model
  config:
    provider: !!js >-
      process.env.P2SDK_PROVIDER === 'mock' ? 'mock' : 'litellm'
    model: !!js >-
      process.env.P2SDK_PROVIDER === 'mock' ? 'mock' :
      (process.env.P2SDK_LLM_MODEL ?? 'glm-5.3-flash')

# Rows that must carry absolute plugin specifiers (llm-replay, p2sdk-handoff)
# are generated at boot into $P2SDK_HOME/runtime-patch.yml by
# src/start.ts#writeRuntimePatch: the $DSH_HOME profile workspace resolves
# package names against itself and has no node_modules, so inserted rows point
# at the app/sdk install through file:// URLs instead.

