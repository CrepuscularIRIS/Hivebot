# P6-10 编排插件（T34/Q-035=A 已开闸：本文件进 src/start.ts 默认链——生产主 bot 获
# create_bot/send_to_bot/stop_bot 与路由提示；测试再显式叠加 = 同 id 整行替换，只可
# 覆盖 config 项）。
# config 项（app/sdk/src/orchestration/main-channel.mjs）：
#   createTimeoutMs  ⑤ 通道超时（决策 30，缺省 30000；超时 → main-unavailable
#                     + outcome:'unknown'，不自动重试，占位释放）
#   capacity         并发 running worker 上限（D9⑥，缺省 3）
#   crashAt          测试专用崩溃注入：'after-create' = #3 返回后、assign 投递前
#                    process.exit（验收 ⑫ 冷 session 窗口）
#   dataDir          bots.json 根；缺省 P2SDK_ORCH_DATA_DIR → PBOTS_DATA_DIR →
#                    $HOME/.config/pbots-ui（identity.mjs；start.ts 不透传
#                    PBOTS_DATA_DIR，故生产注入走 P2SDK_ORCH_DATA_DIR）
- insert:
    - id: pbots-orchestration
      # 相对本 patch 文件目录（profile/patches/）。
      name: ../../src/orchestration/main-channel.mjs
