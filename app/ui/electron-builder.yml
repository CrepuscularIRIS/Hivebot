# T46a：Linux 上交叉打 Windows x64 NSIS 安装包。
# 模仿对象：repos/deepseek-harness/apps/desktop/electron-builder.config.mjs 的「NSIS + 按用户装」；
# 取舍参照 dsh-pet/electron-builder.yml 的「不带源码树进包」。
# 包里只有界面（out/ + package.json + ws）——SDK/launcher/凭证全留 Ubuntu（T46b/T46c 接）。
appId: ai.hivebot.app
productName: Hivebot
directories:
  output: dist-app
# 白名单：electron-builder 默认会把整个 app 目录（renderer-grok 源码树、tests、scripts）带进包，
# 这里显式只留 out/** 与 package.json；生产依赖 node_modules/ws 由 electron-builder 自动追加。
files:
  - out/**
  - package.json
asar: true
# ws 是运行时唯一依赖（main 里 require("ws")），选「打进 asar」（边界 2-a：不改 Linux 构建链）
includeSubNodeDependencies: true
win:
  target:
    - nsis
nsis:
  oneClick: false          # 向导式（dsh 同款），可改安装目录
  perMachine: false        # 按用户装，不要管理员
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 无代码签名证书（Q-045）：SmartScreen 首次会拦，用户点「更多信息 → 仍要运行」
